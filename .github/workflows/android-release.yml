name: Android Release
on:
  push:
    tags: ['v*']

# Public metadata for the owner's selected existing PKCS12 key; never store its bytes/passwords here.
env:
  RELEASE_KEY_ALIAS: key0
  RELEASE_CERT_SHA256: 05E874A19ACBF69C1973F3D3888ECCBA45A9A42CACC0AD51EFB0267AE6D7896B

permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag against source version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/version.py --tag "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"
      - name: Check release signing configuration
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAVE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          for configured in "$HAVE_KEYSTORE" "$HAVE_STORE_PASSWORD" "$HAVE_KEY_PASSWORD"; do
            if [[ "$configured" != true ]]; then
              echo '::error::Configure the three Android signing Secrets described in docs/RELEASING.md; no debug-signing fallback is allowed.'
              exit 1
            fi
          done
          fingerprint=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':')
          [[ "$fingerprint" =~ ^[a-fA-F0-9]{64}$ ]] || { echo '::error::Check the pinned RELEASE_CERT_SHA256 fingerprint.'; exit 1; }
      - uses: ./.github/actions/setup-android
      - name: Run regressions
        run: |
          python3 -m unittest discover -s tests/release -v
          bash tools/test-all.sh
          bash tools/test-followup-navigation-server.sh
      - name: Build APK without signing credentials
        env:
          APK_SIGNING_MODE: unsigned
        run: |
          bash tools/build-servers.sh
          bash tools/build-apk.sh
      - name: Sign and verify with the stable release identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_dir=$(mktemp -d "$RUNNER_TEMP/goldadbhelper-signing.XXXXXX")
          trap 'rm -rf -- "$key_dir"' EXIT
          export RELEASE_KEYSTORE="$key_dir/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          bash tools/sign-apk.sh build/aligned.apk build/release-signed.apk
      - name: Package verified release and source
        run: python3 tools/package-artifacts.py --mode release
      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-results
          path: |
            build/test-results/
            build/followup-navigation-server-tests/results/
            tests/hostui/results.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish complete release, keeping partial uploads in a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Resolve lightweight or annotated tag to its commit, catching mid-run tag movement.
          tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo '::error::Tag moved after build; refusing to publish.'; exit 1; }
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$RELEASE_TAG" '.commit == $sha and .tag == $tag and .signing == "release"' dist/build-metadata.json >/dev/null
          # Never replace a published release, and only resume our draft for this commit.
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' release-state.json >/dev/null || {
              echo '::error::Release already published or draft targets another commit; refusing to overwrite.'
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" \
              --title "GoldenBeetle $RELEASE_VERSION" --draft --generate-notes \
              --notes 'Automated build: APK signature, source/version metadata, checksums and host regressions verified. This does not certify real-device, OEM, USB/Fastboot or screen-streaming compatibility. See docs/REMAINING_VALIDATION.md in the corresponding source. Signing certificate and exact commit are in build-metadata.json.'
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
